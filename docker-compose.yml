services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      ERP_API_PASSWORD: ${ERP_API_PASSWORD:?Set ERP_API_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/schema:ro
      - ./docker/init-db.sh:/docker-entrypoint-initdb.d/10-erp.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL using erp_api and host db}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      TOTP_ENC_KEY: ${TOTP_ENC_KEY:?Set TOTP_ENC_KEY}
      REQUIRE_2FA: ${REQUIRE_2FA:-managers}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
